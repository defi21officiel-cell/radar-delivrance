<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Mon Radar</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">Radar de Délivrance</span>
            <a href="/history" class="btn btn-outline-light btn-sm">Mon Historique</a>
        </div>
    </nav>

    <div class="container pb-5">
        <form action="/save" method="POST">
            <ul class="nav nav-pills mb-3 justify-content-center" id="pills-tab" role="tablist">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab1" type="button">I. VIOLENCE</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab2" type="button">II. DIVINATION</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab3" type="button">III. IDOLÂTRIE</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab4" type="button">IV. IMPURETÉ</button></li>
            </ul>

            <div class="tab-content card p-4 shadow-sm">
                <div class="tab-pane fade show active" id="tab1">
                    <h4>Violence (Destruction et Mort)</h4>
                    <p class="text-muted small">Répondez selon votre cadre personnel, familial ou entourage.</p>
                    <div class="mb-4">
                        <label class="form-label d-block">Ressentez-vous des expressions de haine ou d'auto-mutilation envers votre corps ?</label>
                        <select name="v1" class="form-select">
                            <option>Jamais/Rare</option><option>Souvent</option><option>Fréquent</option><option>Régulier</option><option>Quotidien</option>
                        </select>
                    </div>
                    </div>

                <div class="tab-pane fade" id="tab2">
                    <h4>Divination (Contrôle et Occultisme)</h4>
                    <div class="mb-4">
                        <label class="form-label">Ressentez-vous une « présence » paranormale dans votre quotidien ?</label>
                        <select name="d1" class="form-select">
                            <option>Jamais/Rare</option><option>Souvent</option><option>Fréquent</option><option>Régulier</option><option>Quotidien</option>
                        </select>
                    </div>
                </div>

                <div class="tab-pane fade" id="tab3"><h4>Idolâtrie</h4><p>Questions à venir...</p></div>
                <div class="tab-pane fade" id="tab4"><h4>Impureté</h4><p>Questions à venir...</p></div>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-success btn-lg">Enregistrer mes réponses</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
