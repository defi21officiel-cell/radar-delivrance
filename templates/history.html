<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Historique</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2>Mon Historique de Délivrance</h2>
        <a href="/" class="btn btn-primary mb-3">Faire un nouveau test</a>
        
        <div class="list-group">
            {% for res in results %}
            <div class="list-group-item">
                <h5 class="mb-1">Test du {{ res.date.strftime('%d/%m/%Y %H:%M') }}</h5>
                <p class="mb-1 text-muted small">Données enregistrées avec succès.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
